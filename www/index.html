<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Scotland with Ally</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-text">
      <div class="topbar-title" id="topbarTitle">Scotland with Ally</div>
      <div class="topbar-sub" id="topbarSub">18–24 Aug 2026</div>
    </div>
    <button class="topbar-settings" id="mapBtn" aria-label="Map of all saved places">🗺</button>
    <button class="topbar-settings" id="settingsBtn" aria-label="Settings">⚙</button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-view="today">
      <span class="tab-icon">📍</span><span class="tab-label">Today</span>
    </button>
    <button class="tab" data-view="overview">
      <span class="tab-icon">🏠</span><span class="tab-label">Trip</span>
    </button>
    <button class="tab" data-view="itinerary">
      <span class="tab-icon">🗓️</span><span class="tab-label">Itinerary</span>
    </button>
    <button class="tab" data-view="picks">
      <span class="tab-icon">♡</span><span class="tab-label">Picks</span>
    </button>
    <button class="tab" data-view="budget">
      <span class="tab-icon">💷</span><span class="tab-label">Budget</span>
    </button>
    <button class="tab" data-view="tips">
      <span class="tab-icon">🎒</span><span class="tab-label">Tips</span>
    </button>
  </nav>

  <div class="modal" id="placeModal"></div>
  <div class="map-overlay" id="mapOverlay"></div>
  <div class="search-overlay" id="searchOverlay"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
